<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacqui Helen Minchola - Tu Asesora Patrimonial</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <header class="card-header">
            <div class="header-bg">
                <img src="fondo.jpg" alt="Fondo de mapa mundial">
            </div>
            <div class="profile-pic-container">
                <img src="perfil.png" alt="Jacqui Helen Minchola" class="profile-pic">
            </div>

        <!-- SECCIÓN MODIFICADA: Nombre en una línea y reseña añadida -->
        <section class="profile-info">
            <h1 class="single-line-name">JACQUELINE HELEN MINCHOLA</h1>

                Te ayudo a proteger tu patrimonio y asegurar tu futuro financiero mediante estrategias personalizadas de inversión y gestión de riesgos.
            </p>
        </section>

        <!-- Los elementos de abajo se mueven de manera automática -->
        <section class="main-action">
            <a href="https://wa.me." target="_blank" class="btn-primary">
                AGENDAR CITA GRATUITA
            </a>
        </section>

        <nav class="social-links">
            <a href="https://linkedin.com"  target="_blank" class="link-item">
                <span class="icon-box"><i class="fab fa-linkedin-in"></i></span>
                <span class="link-text">LINKEDIN</span>
            </a>
            <a href="https://instagram.com" target="_blank" class="link-item">
                <span class="icon-box"><i class="fab fa-instagram"></i></span>
                <span class="link-text">INSTAGRAM</span>
            </a>
            <a href="https://facebook.com" target="_blank" class="link-item">
                <span class="icon-box"><i class="fab fa-facebook-f"></i></span>
                <span class="link-text">FACEBOOK</span>
            </a>
        </nav>

        <footer class="card-footer">

        </footer>
    </div>

</body>
</html>
