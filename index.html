<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacqui Helen Minchola - Tu Asesora Patrimonial</title>
    <!-- Fuente de Google Correcta -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Iconos de Redes Sociales Activos (Font Awesome) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Tu archivo de estilos CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div class="card-container">
        
        <!-- ENCABEZADO: Imagen de mapa mundial de fondo -->
        <header class="card-header">
            <div class="header-bg">
                <img src="./imagenes/fondo.jpg" alt="Fondo de mapa mundial">
            </div>
            <!-- FOTO DE PERFIL: Tu foto centrada cambiada a .png -->
            <div class="profile-pic-container">
                <img src="./imagenes/perfil.png" alt="Jacqui Helen Minchola" class="profile-pic">
            </div>
        </header>

        <!-- INFORMACIÓN PRINCIPAL -->
        <section class="profile-info">
            <h1>JACQUELINE HELEN MINCHOLA</h1>
            <p class="subtitle">SEGUROS E INVERSIONES</p>
        </section>

        <!-- BOTÓN DE ACCIÓN PRINCIPAL (Redirecciona a tu WhatsApp real) -->
        <div class="main-action">
            <a href="https://wa.me." target="_blank" class="btn-primary">AGENDAR CITA GRATUITA</a>
        </div>

        <!-- ENLACES A REDES SOCIALES -->
        <nav class="social-links">
            <!-- LinkedIn Conectado -->
            <a href="https://linkedin.com" target="_blank" class="link-item">
                <div class="icon-box"><i class="fa-brands fa-linkedin-in"></i></div>
                <span class="link-text">LINKEDIN</span>
            </a>

            <!-- Instagram Conectado -->
            <a href="https://instagram.com" target="_blank" class="link-item">
                <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                <span class="link-text">INSTAGRAM</span>
            </a>

            <!-- Facebook Conectado -->
            <a href="https://facebook.com" target="_blank" class="link-item">
                <div class="icon-box"><i class="fa-brands fa-facebook-f"></i></div>
                <span class="link-text">FACEBOOK</span>
            </a>
        </nav>

        <!-- PIE DE PÁGINA: Tu Logotipo corporativo cambiado a .png -->
        <footer class="card-footer">
            <img src="./imagenes/logo.png" alt="Tu Asesora Patrimonial Logo" class="footer-logo">
        </footer>

    </div>

</body>
</html>
